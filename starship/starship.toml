"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 100
command_timeout = 1000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$python\
$aws\
$azure\
$kubernetes\
$cmd_duration\
$line_break\
$character\
"""

[aws]
format = '\[[$symbol ($profile)(@$region)(\[$duration\])]($style)\] '
symbol = '󰸏'
style = "yellow"

[azure]
format = '\[[$symbol ($subscription)]($style)\] '
disabled = true
style = "blue"

[character]
success_symbol = '[\$](green)'
error_symbol = '[\$](red)'

[cmd_duration]
format = '\[[took $duration]($style)\] '
style = 'none'

[directory]
truncation_length = 99
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' 🔒'
style = "cyan"

[git_branch]
format = '\[[$symbol$branch]($style)\] '
style = "purple"

[git_commit]
style = "green"

[git_state]
style = "yellow"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "red"

[hostname]
format = '[@$hostname]($style)\] '
style = 'green'
ssh_only = false

[kubernetes]
format = '\[[$symbol$context( \($namespace\))]($style)\] '
disabled = false
style = '#5989eb'

[python]
format = '\[[${symbol} ${pyenv_prefix}(${version})(\($virtualenv\))]($style)\] '
symbol = ''
style = "yellow"

[username]
format = '\[[$user]($style)'
style_user = 'green'
show_always = true
style_root = "red"
